<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f1a" />
<title>决策硬币 · Decision Coin</title>
<style>
  :root {
    --bg: #0b0f1a;
    --bg2: #121826;
    --bg3: #1a2234;
    --card: rgba(26, 34, 52, 0.85);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text: #eef2ff;
    --muted: #94a3b8;
    --accent: #7c6cff;
    --accent2: #22d3ee;
    --gold: #f5c842;
    --gold-dim: #c9a227;
    --success: #34d399;
    --danger: #f87171;
    --radius: 16px;
    --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    --font: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124, 108, 255, 0.28), transparent),
      radial-gradient(ellipse 60% 40% at 100% 50%, rgba(34, 211, 238, 0.08), transparent),
      radial-gradient(ellipse 50% 30% at 0% 80%, rgba(245, 200, 66, 0.06), transparent),
      var(--bg);
    padding: 24px 16px 48px;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .logo-coin {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--gold), var(--gold-dim));
    box-shadow: 0 0 20px rgba(245, 200, 66, 0.35);
    display: grid;
    place-items: center;
    font-size: 18px;
    color: #3a2a00;
    font-weight: 800;
  }

  h1 {
    font-size: 1.65rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: linear-gradient(90deg, #fff, #c4b5fd);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 4px;
  }

  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }

  .chip {
    appearance: none;
    border: 1px solid var(--border-strong);
    background: var(--bg3);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .chip:hover {
    border-color: var(--accent);
    background: rgba(124, 108, 255, 0.15);
    transform: translateY(-1px);
  }

  .chip:active { transform: scale(0.97); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
  }

  .card-title {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  label.field-label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  textarea, input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
  }

  textarea:focus, input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124, 108, 255, 0.2);
  }

  textarea { min-height: 64px; }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  .option-row input[type="text"] {
    border: none;
    background: transparent;
    padding: 6px 4px;
    box-shadow: none;
  }

  .option-row input[type="text"]:focus {
    box-shadow: none;
  }

  .weight-wrap {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    gap: 2px 8px;
    align-items: center;
    min-width: 130px;
  }

  .weight-wrap label {
    font-size: 0.7rem;
    color: var(--muted);
    grid-column: 1 / -1;
  }

  .weight-wrap input[type="range"] {
    width: 90px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .prob-badge {
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
    color: var(--accent2);
    font-weight: 600;
    min-width: 36px;
    text-align: right;
  }

  .btn-icon {
    appearance: none;
    border: none;
    background: rgba(248, 113, 113, 0.12);
    color: var(--danger);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    display: grid;
    place-items: center;
    transition: background 0.15s;
    font-family: inherit;
  }

  .btn-icon:hover { background: rgba(248, 113, 113, 0.25); }
  .btn-icon:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .row-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .btn {
    appearance: none;
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  }

  .btn:active { transform: scale(0.97); }
  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
  }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text);
  }

  .btn-ghost:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.05);
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #5b4cdb);
    color: #fff;
    box-shadow: 0 8px 24px rgba(124, 108, 255, 0.35);
    flex: 1;
  }

  .btn-primary:hover:not(:disabled) {
    box-shadow: 0 10px 28px rgba(124, 108, 255, 0.5);
  }

  .btn-gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    color: #2a1f00;
    box-shadow: 0 8px 28px rgba(245, 200, 66, 0.4);
    width: 100%;
    padding: 16px 20px;
    font-size: 1.1rem;
    letter-spacing: 0.04em;
  }

  .btn-gold:hover:not(:disabled) {
    box-shadow: 0 12px 36px rgba(245, 200, 66, 0.55);
  }

  .btn-success {
    background: linear-gradient(135deg, var(--success), #10b981);
    color: #052e1c;
    flex: 1;
  }

  /* ===== Flip stage ===== */
  .stage {
    display: none;
    text-align: center;
    padding: 28px 16px 20px;
  }

  .stage.active { display: block; }

  .coin-scene {
    perspective: 800px;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }

  .coin {
    width: 120px;
    height: 120px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.1s;
  }

  .coin.flipping {
    animation: coinFlip 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
  }

  @keyframes coinFlip {
    0%   { transform: rotateY(0deg) rotateX(0deg) scale(1); }
    20%  { transform: rotateY(360deg) rotateX(20deg) scale(1.1); }
    50%  { transform: rotateY(900deg) rotateX(-10deg) scale(1.15); }
    80%  { transform: rotateY(1440deg) rotateX(5deg) scale(1.05); }
    100% { transform: rotateY(1800deg) rotateX(0deg) scale(1); }
  }

  .coin-face {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    backface-visibility: hidden;
    font-size: 2.4rem;
    font-weight: 800;
    box-shadow:
      inset 0 -6px 12px rgba(0,0,0,0.25),
      inset 0 6px 12px rgba(255,255,255,0.25),
      0 12px 30px rgba(0,0,0,0.4);
  }

  .coin-front {
    background: linear-gradient(145deg, #ffe566, #d4a017);
    color: #3a2a00;
  }

  .coin-back {
    background: linear-gradient(145deg, #c4b5fd, #7c6cff);
    color: #1e1040;
    transform: rotateY(180deg);
  }

  .reveal {
    opacity: 0;
    transform: translateY(12px);
    transition: all 0.5s ease;
  }

  .reveal.show {
    opacity: 1;
    transform: none;
  }

  .reveal-label {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .reveal-choice {
    font-size: 1.75rem;
    font-weight: 700;
    background: linear-gradient(90deg, var(--gold), #fff, var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1.3;
    word-break: break-word;
    margin-bottom: 10px;
  }

  .reveal-probs {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.6;
    background: var(--bg);
    border-radius: 10px;
    padding: 10px 12px;
    margin: 12px 0 16px;
    text-align: left;
  }

  .reveal-probs strong {
    color: var(--accent2);
    font-weight: 600;
  }

  .confetti {
    pointer-events: none;
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 50;
  }

  .confetti i {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    top: -10px;
    animation: fall linear forwards;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(720deg);
      opacity: 0;
    }
  }

  /* ===== History ===== */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 320px;
    overflow-y: auto;
  }

  .history-empty {
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
    padding: 20px 8px;
  }

  .history-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    animation: fadeIn 0.2s ease;
  }

  .history-item .time {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .history-item .chosen {
    font-weight: 600;
    color: var(--gold);
    margin-bottom: 4px;
  }

  .history-item .meta {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.45;
  }

  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .history-header .card-title { margin-bottom: 0; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 24px;
    opacity: 0.7;
  }

  .hint {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 8px;
  }

  .shake {
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  @media (max-width: 420px) {
    .option-row {
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
    }
    .weight-wrap {
      grid-column: 1 / -1;
      min-width: 0;
      width: 100%;
    }
    .weight-wrap input[type="range"] { width: 100%; }
    .btn-icon { grid-row: 1; grid-column: 2; }
    h1 { font-size: 1.4rem; }
    .reveal-choice { font-size: 1.45rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">
        <div class="logo-coin">¥</div>
        <h1>决策硬币</h1>
      </div>
      <p class="tagline">纠结时抛一枚 · 加权随机 · 帮你轻轻推一把</p>
    </header>

    <div class="presets" id="presets"></div>

    <!-- Input panel -->
    <section class="card" id="inputPanel">
      <div class="card-title">选项</div>
      <div class="options" id="options"></div>
      <div class="row-actions">
        <button type="button" class="btn btn-ghost" id="btnAdd">＋ 添加选项</button>
      </div>

      <div style="margin-top: 18px;">
        <label class="field-label" for="context">约束 / 备注（可选）</label>
        <textarea id="context" placeholder="例如：预算 50 元以内、不想跑太远、今晚要早睡…"></textarea>
      </div>

      <p class="hint" id="probHint">各选项权重相等时概率相同；拖动滑块调整倾向。</p>
    </section>

    <button type="button" class="btn btn-gold" id="btnFlip" style="margin-bottom: 16px;">
      🪙 抛硬币 · 帮我决定
    </button>

    <!-- Reveal stage -->
    <section class="card stage" id="stage">
      <div class="coin-scene">
        <div class="coin" id="coin">
          <div class="coin-face coin-front">¥</div>
          <div class="coin-face coin-back">?</div>
        </div>
      </div>
      <div class="reveal" id="reveal">
        <div class="reveal-label">命运选中了</div>
        <div class="reveal-choice" id="revealChoice">—</div>
        <div class="reveal-probs" id="revealProbs"></div>
        <div class="row-actions">
          <button type="button" class="btn btn-ghost" id="btnAgain">再抛一次</button>
          <button type="button" class="btn btn-success" id="btnAccept">✓ 接受这次决定</button>
        </div>
        <button type="button" class="btn btn-ghost" id="btnBack" style="width:100%;margin-top:10px;">← 修改选项</button>
      </div>
    </section>

    <!-- History -->
    <section class="card">
      <div class="history-header">
        <div class="card-title">决策记录</div>
        <button type="button" class="btn btn-ghost" id="btnClearHistory" style="padding:6px 12px;font-size:0.8rem;">清空</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </section>

    <footer>决策硬币 · 本地运行 · 数据仅保存在你的浏览器</footer>
  </div>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "decision-coin-history-v1";
  const MAX_OPTIONS = 8;
  const MIN_OPTIONS = 2;

  const PRESETS = [
    {
      label: "今晚吃啥",
      context: "别太贵，走路 15 分钟内能到",
      options: [
        { text: "火锅", weight: 3 },
        { text: "日料", weight: 2 },
        { text: "麻辣烫", weight: 2 },
        { text: "自己做", weight: 1 },
      ],
    },
    {
      label: "要不要跳槽",
      context: "薪资涨幅、通勤、团队氛围都要考虑",
      options: [
        { text: "接受 offer，跳槽", weight: 2 },
        { text: "再观望三个月", weight: 3 },
        { text: "留下，谈加薪", weight: 2 },
      ],
    },
  ];

  /** @type {{ id: string, text: string, weight: number }[]} */
  let options = [];
  let flipping = false;
  let lastResult = null;

  const $ = (sel) => document.querySelector(sel);
  const optionsEl = $("#options");
  const contextEl = $("#context");
  const stageEl = $("#stage");
  const inputPanel = $("#inputPanel");
  const coinEl = $("#coin");
  const revealEl = $("#reveal");
  const revealChoice = $("#revealChoice");
  const revealProbs = $("#revealProbs");
  const historyList = $("#historyList");
  const btnFlip = $("#btnFlip");
  const btnAdd = $("#btnAdd");
  const presetsEl = $("#presets");

  function uid() {
    return "o_" + Math.random().toString(36).slice(2, 9);
  }

  function defaultOptions() {
    return [
      { id: uid(), text: "", weight: 5 },
      { id: uid(), text: "", weight: 5 },
    ];
  }

  function totalWeight() {
    return options.reduce((s, o) => s + Math.max(1, o.weight), 0);
  }

  function probability(o) {
    const t = totalWeight();
    if (t <= 0) return 0;
    return (Math.max(1, o.weight) / t) * 100;
  }

  function validOptions() {
    return options.filter((o) => o.text.trim().length > 0);
  }

  function renderPresets() {
    presetsEl.innerHTML = PRESETS.map(
      (p, i) =>
        `<button type="button" class="chip" data-preset="${i}">✨ ${escapeHtml(p.label)}</button>`
    ).join("");
    presetsEl.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        const p = PRESETS[Number(btn.dataset.preset)];
        loadPreset(p);
      });
    });
  }

  function loadPreset(p) {
    options = p.options.map((o) => ({
      id: uid(),
      text: o.text,
      weight: o.weight,
    }));
    contextEl.value = p.context || "";
    showInput();
    renderOptions();
  }

  function renderOptions() {
    optionsEl.innerHTML = "";
    const canRemove = options.length > MIN_OPTIONS;

    options.forEach((o, idx) => {
      const row = document.createElement("div");
      row.className = "option-row";
      row.dataset.id = o.id;

      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = `选项 ${idx + 1}`;
      input.value = o.text;
      input.maxLength = 40;
      input.addEventListener("input", () => {
        o.text = input.value;
        updateProbBadges();
      });

      const weightWrap = document.createElement("div");
      weightWrap.className = "weight-wrap";
      weightWrap.innerHTML = `<label>权重</label>`;
      const range = document.createElement("input");
      range.type = "range";
      range.min = "1";
      range.max = "10";
      range.value = String(o.weight);
      range.addEventListener("input", () => {
        o.weight = Number(range.value);
        updateProbBadges();
      });
      weightWrap.appendChild(range);

      const badge = document.createElement("span");
      badge.className = "prob-badge";
      badge.dataset.for = o.id;
      badge.textContent = Math.round(probability(o)) + "%";

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "btn-icon";
      remove.title = "删除";
      remove.textContent = "×";
      remove.disabled = !canRemove;
      remove.addEventListener("click", () => {
        if (options.length <= MIN_OPTIONS) return;
        options = options.filter((x) => x.id !== o.id);
        renderOptions();
      });

      weightWrap.appendChild(badge);

      row.appendChild(input);
      row.appendChild(weightWrap);
      row.appendChild(remove);

      optionsEl.appendChild(row);
    });

    btnAdd.disabled = options.length >= MAX_OPTIONS;
    updateProbBadges();
  }

  function updateProbBadges() {
    options.forEach((o) => {
      const badge = optionsEl.querySelector(`.prob-badge[data-for="${o.id}"]`);
      if (badge) badge.textContent = Math.round(probability(o)) + "%";
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function weightedPick(list) {
    const total = list.reduce((s, o) => s + Math.max(1, o.weight), 0);
    let r = Math.random() * total;
    for (const o of list) {
      r -= Math.max(1, o.weight);
      if (r <= 0) return o;
    }
    return list[list.length - 1];
  }

  function showInput() {
    stageEl.classList.remove("active");
    inputPanel.style.display = "";
    btnFlip.style.display = "";
    revealEl.classList.remove("show");
    coinEl.classList.remove("flipping");
  }

  function showStage() {
    inputPanel.style.display = "none";
    btnFlip.style.display = "none";
    stageEl.classList.add("active");
    revealEl.classList.remove("show");
  }

  function spawnConfetti() {
    const box = $("#confetti");
    box.innerHTML = "";
    const colors = ["#f5c842", "#7c6cff", "#22d3ee", "#34d399", "#f472b6", "#fff"];
    for (let i = 0; i < 48; i++) {
      const el = document.createElement("i");
      el.style.left = Math.random() * 100 + "%";
      el.style.background = colors[i % colors.length];
      el.style.animationDuration = 1.2 + Math.random() * 1.6 + "s";
      el.style.animationDelay = Math.random() * 0.35 + "s";
      el.style.width = 6 + Math.random() * 8 + "px";
      el.style.height = 6 + Math.random() * 8 + "px";
      box.appendChild(el);
    }
    setTimeout(() => { box.innerHTML = ""; }, 3200);
  }

  function flip() {
    if (flipping) return;
    const list = validOptions();
    if (list.length < MIN_OPTIONS) {
      inputPanel.classList.add("shake");
      setTimeout(() => inputPanel.classList.remove("shake"), 400);
      alert("请至少填写 2 个有效选项");
      return;
    }

    flipping = true;
    const chosen = weightedPick(list);
    const context = contextEl.value.trim();
    const total = list.reduce((s, o) => s + Math.max(1, o.weight), 0);

    lastResult = {
      chosen: chosen.text.trim(),
      options: list.map((o) => ({
        text: o.text.trim(),
        weight: Math.max(1, o.weight),
        prob: ((Math.max(1, o.weight) / total) * 100).toFixed(1),
      })),
      context,
      time: Date.now(),
    };

    showStage();
    coinEl.classList.remove("flipping");
    void coinEl.offsetWidth;
    coinEl.classList.add("flipping");

    setTimeout(() => {
      revealChoice.textContent = lastResult.chosen;
      revealProbs.innerHTML =
        "<div style='margin-bottom:4px'>本次概率分布：</div>" +
        lastResult.options
          .map((o) => {
            const mark = o.text === lastResult.chosen ? " ← 中奖" : "";
            return `<div>${escapeHtml(o.text)} · <strong>${o.prob}%</strong>${mark}</div>`;
          })
          .join("") +
        (context
          ? `<div style="margin-top:8px;opacity:0.85">备注：${escapeHtml(context)}</div>`
          : "");
      revealEl.classList.add("show");
      spawnConfetti();
      flipping = false;
    }, 1850);
  }

  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  function saveHistory(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items.slice(0, 50)));
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function renderHistory() {
    const items = loadHistory();
    if (!items.length) {
      historyList.innerHTML = '<div class="history-empty">还没有记录。抛一次硬币，决定就会留在这里。</div>';
      return;
    }
    historyList.innerHTML = items
      .map((h) => {
        const opts = (h.options || []).map((o) => o.text || o).join(" / ");
        const note = h.context
          ? `<div class="meta">备注：${escapeHtml(h.context)}</div>`
          : "";
        return `<div class="history-item">
          <div class="time">${escapeHtml(formatTime(h.time))}</div>
          <div class="chosen">→ ${escapeHtml(h.chosen)}</div>
          <div class="meta">选项：${escapeHtml(opts)}</div>
          ${note}
        </div>`;
      })
      .join("");
  }

  function acceptDecision() {
    if (!lastResult) return;
    const items = loadHistory();
    items.unshift({ ...lastResult });
    saveHistory(items);
    renderHistory();
    // Soft feedback
    const btn = $("#btnAccept");
    const old = btn.textContent;
    btn.textContent = "已记下 ✓";
    btn.disabled = true;
    setTimeout(() => {
      btn.textContent = old;
      btn.disabled = false;
      showInput();
    }, 900);
  }

  // Events
  btnAdd.addEventListener("click", () => {
    if (options.length >= MAX_OPTIONS) return;
    options.push({ id: uid(), text: "", weight: 5 });
    renderOptions();
  });

  btnFlip.addEventListener("click", flip);
  $("#btnAgain").addEventListener("click", () => {
    if (flipping) return;
    flip();
  });
  $("#btnAccept").addEventListener("click", acceptDecision);
  $("#btnBack").addEventListener("click", showInput);

  $("#btnClearHistory").addEventListener("click", () => {
    if (!loadHistory().length) return;
    if (confirm("确定清空全部决策记录？")) {
      localStorage.removeItem(STORAGE_KEY);
      renderHistory();
    }
  });

  // Init
  options = defaultOptions();
  renderPresets();
  renderOptions();
  renderHistory();
})();
</script>
</body>
</html>
